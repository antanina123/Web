<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="mcera.lt - Your Ultimate Minecraft Adventure. Join our community for PvP, PvE, Economy & Events!">
    <title>MCERA | Patirk nuotykį!</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Base styles -->
    <style>
        :root {
        
            --primary-color: #2ecc71;
            --accent-color: #27ae60;
            --dark-bg: #1a1a1a;
            --light-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--light-text);
            background-color: var(--dark-bg);
        }

        .navbar {
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem;
            z-index: 1000;
        }

        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--light-text);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url('minecraft-forest.jpg');
            background-size: cover;
            background-position: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .server-ip {
            font-size: 2rem;
            color: var(--primary-color);
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        .cta-button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--primary-color);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .server-ip {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">mcera.lt</div>
            <div class="nav-links">
                <a href="#rules">Taisyklės</a>
                <a href="#discord">Discordas</a>
                <a href="#bans">Banai</a>
                <a href="#vote">Balsai</a>
                <a href="Paslaugos.html" class="cta-button">Paslaugos</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <h1>Sveikas atvykes į MCERA.LT</h1>
        <p>Kelionės prasideda čia!</p>
        <div class="server-ip">play.mcera.lt</div>
        <p>Versija 1.21 - 1.21.4</p>
        <button class="cta-button">TUČTOJAU JUNKIS</button>
    </section>

    <!-- Additional sections will be added in subsequent parts -->

</body>
</html></section>
